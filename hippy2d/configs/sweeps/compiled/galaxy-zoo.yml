program: scripts/training.py
name: compiled-galaxy-zoo
method: grid
metric:
  name: val_loss
  goal: minimize
parameters:
  dataset_name:
    value: GalaxyZoo
  d_hparams:
    parameters:
      batch_size:
        value: 64
      data_dir:
        value: data
      target_size:
        value: 96
      use_circ_mask:
        value: true
  early_stopping:
    value: 30
  epochs:
    value: 100
  lr_name:
    value: MultiStepLR
  lr_hparams:
    parameters:
      gamma:
        value: 0.1
      milestones:
        value: [30, 50, 70]
  model_name:
    value: MBPrototype
  m_param:
    parameters:
      in_channels:
        value: 3
      num_classes:
        value: 8
      input_size:
        value: 96
      disable_act1:
        value: true
      norm1_layer:
        value: none
      norm2_layer:
        value: batch
      kernels_size:
        value: [11, 11, 11]
      layers:
        value: [1, 2, 2]
      channels:
        value: [16, 32, 40]
      block_types:
        value: ["MBConvBlock", "MBConvBlock", "MBConvBlock"]
      layer:
        value: "OptimalBasisBlock"
      channels_masking:
        value: false
      default_layer_kwargs: 
        parameters:
          pre_norm_func:
            value: "layer_norm"
          phase_func:
            value: "polar"
          mag_func:
            value: "nicks"
          max_order:
            value: 3
  optimizer_hparams:
    parameters:
      lr:
        value: 0.0015
      weight_decay:
        value: 0.05
  optimizer_name:
    value: AdamW
  label_smoothing:
    value: 0.1
  run_name:
    value: compiled-galaxy-zoo
  seed:
    values: [42, 7, 74]
