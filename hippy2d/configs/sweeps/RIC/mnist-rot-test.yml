program: scripts/training.py
name: mnist-rot-test-RIC
method: grid
metric:
  name: val_loss
  goal: minimize
parameters:
  dataset_name:
    value: MnistRotTest
  d_hparams:
    parameters:
      batch_size:
        value: 64
      test_batch_size:
          value: 64
      data_dir:
        value: data
      pad:
        value: 0
      to_complex:
        value: false
      normalize:
        value: true
  early_stopping:
    value: 15
  epochs:
    value: 100
  lr_name:
    value: MultiStepLR
  lr_hparams:
    parameters:
      gamma:
        value: 0.1
      milestones:
        value: [30, 50, 70]
  model_name:
    value: RIC
  m_param:
    parameters:
      in_channels: 
        value: 1
      input_size:
        value: 64
      batch_size:
        value: 16
  optimizer_hparams:
    parameters:
      lr:
        value: 0.0015
      weight_decay:
        value: 0.05
  optimizer_name:
    value: AdamW
  label_smoothing:
    value: 0.1
  run_name:
    value: RIC-mnist-rot-test
  seed:
    values: [42, 7, 123]