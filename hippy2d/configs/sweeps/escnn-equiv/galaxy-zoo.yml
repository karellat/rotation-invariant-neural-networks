program: scripts/training.py
name: escnn-galaxy-zoo
method: grid
metric:
  name: val_loss
  goal: minimize
parameters:
  dataset_name:
    value: GalaxyZoo
  d_hparams:
    parameters:
      batch_size:
        value: 64
      data_dir:
        value: data
      target_size:
        value: 96
      use_circ_mask:
        value: true
  early_stopping:
    value: 30
  epochs:
    value: 100
  lr_name:
    value: MultiStepLR
  lr_hparams:
    parameters:
      gamma:
        value: 0.1
      milestones:
        value: [30, 50, 70]
  model_name:
    value: E2Cnn
  m_param:
    parameters:
      in_channels:
        value: 3
      input_size:
        value: 96
      max_order:
        value: 3
      stem_channels:
        value: 16
      channels:
        value: [16, 32, 40]
      block_type:
        value: GatedBlock
      trivial_pooling_type:
        value: PointwiseMaxPool
  optimizer_hparams:
    parameters:
      lr:
        value: 0.0015
      weight_decay:
        value: 0.05
  optimizer_name:
    value: AdamW
  label_smoothing:
    value: 0.1
  run_name:
    value: escnn-galaxy-zoo
  seed:
    values: [42, 7, 74]
