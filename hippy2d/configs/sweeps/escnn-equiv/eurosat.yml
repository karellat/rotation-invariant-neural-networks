program: scripts/training.py
name: escnn-equiv-eurosat-gated
method: grid
metric:
  name: val_loss
  goal: minimize
parameters:
  dataset_name:
    value: EuroSAT
  d_hparams:
    parameters:
      batch_size:
        value: 32
      test_batch_size:
        value: 128
      data_dir:
        value: data
      to_complex:
        value: false
  early_stopping:
    value: 15
  epochs:
    value: 100
  lr_name:
    value: MultiStepLR
  lr_hparams:
    parameters:
      gamma:
        value: 0.1
      milestones:
        value: [10, 25, 40]
  model_name:
    value: E2Cnn
  m_param:
    values:
      - in_channels: 3
        input_size: 64
        max_order: 3
        stem_channels: 16
        channels: [16, 32, 40]
        block_type: GatedBlock
        trivial_pooling_type: PointwiseMaxPool
  optimizer_hparams:
    parameters:
      lr:
        value: 0.001
  optimizer_name:
    value: AdamW
  label_smoothing:
    value: 0.1
  run_name:
    value: e2cnn-eurosat-escnn-equiv-gated-sweep
  seed:
    values: [42, 43, 44]
