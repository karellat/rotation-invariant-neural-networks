name: nrings-hist
program: scripts/training.py
method: bayes
metric:
  name: val_accuracy
  goal: maximize
parameters:
  d_hparams:
    parameters:
      batch_size:
        value: 128
      data_dir:
        value: data
      pad:
        value: 0
      target_size:
        value: 96
  dataset_name:
    value: ColorectalHistology
  early_stopping:
    value: 15
  epochs:
    value: 150
  lr_hparams:
    parameters:
      gamma:
        value: 0.1
      milestones:
        value: [10, 15, 25]
  lr_name:
    value: MultiStepLR
  m_param:
    parameters:
      in_channels:
        value: 1
      input_size:
        value: 96
      num_classes:
        value: 10
      init_channels:
        value: [5, 8, 8]
      channels_masking:
        values: [true, false]
      layer:
        value: LearnableFlusser
      layer_kwargs: 
        parameters:
          ring_count:
            distribution: int_uniform
            min: 3
            max: 7
  model_name:
    value: PrototypeOptimalInvCNN
  optimizer_hparams:
    parameters:
      lr:
        value: 0.001
  optimizer_name:
    value: AdamW
  run_name:
    value: nrings
  seed:
    values: [42, 7, 123, 24, 74]