program: scripts/training.py
name: e2cnn-mnist-rot-test
method: grid
metric:
  name: val_loss
  goal: minimize
parameters:
  dataset_name:
    value: MnistRotTest
  d_hparams:
    parameters:
      batch_size:
        value: 32
      test_batch_size:
        value: 128
      data_dir:
        value: data
      pad:
        value: 0
      to_complex:
        value: false
  early_stopping:
    value: 15
  epochs:
    value: 100
  lr_name:
    value: MultiStepLR
  lr_hparams:
    parameters:
      gamma:
        value: 0.1
      milestones:
        value: [10, 50, 90]
  model_name:
    value: E2Cnn
  m_param:
    parameters:
      in_channels:
        value: 1
      input_size:
        value: 150
      max_order: 
        value: 3
      stem_channels:
        value: 16
      channels:
        value: [16, 32, 40]
      trivial_pooling_type:
        values: [PointwiseMaxPoolAntialiased2D, PointwiseMaxPool]
      block_type:
        value: GatedBlock
  optimizer_hparams:
    parameters:
      lr:
        value: 0.001
  optimizer_name:
    value: AdamW
  label_smoothing:
    value: 0.1
  run_name:
    value: e2cnn-mnist-rot-test
  seed:
    values: [42, 7, 123, 24, 74]