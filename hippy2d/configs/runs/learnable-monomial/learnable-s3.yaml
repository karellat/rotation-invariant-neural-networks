d_hparams:
  batch_size: 64
  data_dir: data
  pad: 0
  to_complex: false
  normalize: true
dataset_name: MnistRotTest
early_stopping: 10
epochs: 50
lr_hparams:
  gamma: 0.1
  milestones:
  - 10
  - 15
  - 25
lr_name: MultiStepLR
m_param:
  in_channels: 1
  input_size: 64
  num_classes: 10
  init_channels: [5, 8, 8]
  layer: VarLearnableFlusser
  layer_kwargs: 
    phase_orders: [0, 0, 0, 1, 1, 2, 2, 3, 4]
    radial_basis: monomial
    radial_masking: ftukey
    phase_radial_filtering: true
model_name: PrototypeOptimalInvCNN
optimizer_hparams:
  lr: 0.01525
optimizer_name: AdamW
run_name: learnable-monomial-ftukey-phase-filtered
seed: 32
