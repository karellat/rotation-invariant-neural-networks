d_hparams:
  batch_size: 16
  data_dir: data
  upscale_size: 64
dataset_name: RotMnist
early_stopping: 30
epochs: 60
lr_hparams:
  gamma: 0.1
  milestones:
  - 30
  - 50
  - 70
lr_name: MultiStepLR
model_name: MBPrototype 
m_param:
  in_channels: 3
  input_size: 64
  norm1_layer: "none"
  norm2_layer: batch
  kernels_size: [11, 11, 11]
  disable_act1: true
  layers: [1, 2, 2]
  channels: [16, 20, 26]
  block_types: ["MBConvBlock", "MBConvBlock", "MBConvBlock"]
  layer: "OptimalBasisBlock"
  default_layer_kwargs: 
    pre_norm_func: "layer_norm"
    phase_func: "polar"
    magnitude_func: "nicks"
  drop_rate: 0.2
  channels_masking: true 
optimizer_hparams:
  lr: 0.001525
  weight_decay: 0.05
optimizer_name: AdamW
run_name: compiled
seed: 42
